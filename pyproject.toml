[project]
name = "text2sql-ft"
version = "0.1.0"
description = "QLoRA SFT + GRPO fine-tuning of a small open model for text-to-SQL on BIRD/Spider"
requires-python = ">=3.10"
dependencies = [
    "datasets>=3.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "pandas>=2.0",
    "sqlglot>=25.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.4",
    "transformers>=4.52",
    "trl>=0.19",
    "peft>=0.14",
    "bitsandbytes>=0.45",
    "accelerate>=1.0",
    "wandb>=0.18",
]
serve = [
    "vllm>=0.9",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
]
api = ["anthropic>=0.40"]
demo = ["gradio>=5.0"]
viz = ["matplotlib>=3.8"]
dev = ["pytest>=8.0", "ruff>=0.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
