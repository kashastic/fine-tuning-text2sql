# Variant A: plain SQL output. Roughly 3-5 GPU hours on one A100 40GB.
run_name: sft-plain
output_dir: outputs/sft-plain
seed: 13

model:
  name: Qwen/Qwen3-4B
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  double_quant: true
  compute_dtype: bfloat16
  dtype: auto
  device_map: auto
  attn_implementation: sdpa

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

data:
  train_file: data/processed/train.jsonl
  val_file: data/processed/val.jsonl

train:
  max_seq_length: 4096
  packing: false
  num_train_epochs: 2
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8      # effective batch 16
  learning_rate: 1.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  logging_steps: 10
  # Step-based, not epoch-based: two epochs give two validation points, which
  # cannot show a loss curve turning, and the last checkpoint is then the one
  # you serve even if it overfit. 15,697 train rows at effective batch 16 is
  # ~980 steps/epoch, so every 100 steps gives ~20 eval points over two
  # epochs. (The 9.4k this once said was BIRD alone, before Spider's train
  # split joined the mix -- see docs/MEASUREMENTS.md M14.)
  eval_strategy: steps
  eval_steps: 100
  save_strategy: steps          # must match eval_strategy for best-checkpoint
  save_steps: 100               # must be a multiple of eval_steps
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  early_stopping_patience: 3    # eval events, not epochs
  bf16: true
  gradient_checkpointing: true
  optim: paged_adamw_8bit
  max_grad_norm: 1.0
  report_to: [wandb]
